name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: chain

      # The compiler these sources were written for: the release (or commit) pinned in cancho.toml, read from there so there is one place to change it, and installed prebuilt.
      - name: Install the pinned compiler
        working-directory: chain
        run: |
          pin=$(sed -n 's/^cancho *= *"\([0-9a-f.]*\)".*/\1/p' cancho.toml)
          curl -fsSL https://raw.githubusercontent.com/alpibrusl/cancho/main/scripts/install.sh | sh -s "$pin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The secp256k1 package (cancho#710, and cancho#725 which made its statics buildable by the pinned compiler's front end) and the HTTP client driver's `adopt` (cancho#727, which the executor needs) are newer than the pinned compiler: their sources are taken from a later commit. The compiler that builds them is still the pin.
      - name: Check out cancho's packages
        uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: 9b9b660aeda7cd80d140f8743e83c487fd72f576
          path: cancho-packages

      - name: Check out cancho-schema
        uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho-schema
          path: cancho-schema

      - name: Check out cancho-log
        uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho-log
          path: cancho-log

      # In a virtual environment: the checks run `python3 -I`, which ignores the user site where a plain `pip install` goes.
      - name: Python oracles
        run: |
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install coincurve ecdsa pycryptodome eth-account eth-abi rlp eth-utils jsonschema cryptography
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"

      - name: Gate
        working-directory: chain
        run: |
          CANCHO=$HOME/.local/bin/cancho \
          CANCHO_PACKAGES=$GITHUB_WORKSPACE/cancho-packages/packages \
          CANCHO_SCHEMA=$GITHUB_WORKSPACE/cancho-schema/src/schema.cho \
          CANCHO_LOG=$GITHUB_WORKSPACE/cancho-log/src \
          scripts/gate.sh
